<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NicheAI PLG Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
            serif: ['"Newsreader"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f6f6f9',
              100: '#ececf3',
              200: '#d5d5e3',
              300: '#b1b1cc',
              400: '#8686b0',
              500: '#646497',
              600: '#4e4e79',
              700: '#3f3f61',
              800: '#363653',
              900: '#2f2f45',
              950: '#1b1b26',
            },
            accent: {
              500: '#f97316',
              600: '#ea580c',
            }
          },
          boxShadow: {
            'subtle': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
            'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
            'float': '0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04)',
            'toolbar': '0 0 0 1px rgba(255,255,255,0.1), 0 8px 16px rgba(0,0,0,0.3)',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(circle at 1px 1px, #E2E8F0 1px, transparent 0);
      background-size: 24px 24px;
    }
    
    .panel {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.05);
    }

    .mad-lib-input {
      background: rgba(243, 244, 246, 0.5);
      border: 1px dashed #D1D5DB;
      color: #111827;
      outline: none;
      transition: all 0.2s ease;
      font-weight: 500;
      padding: 4px 12px;
      margin: 0 4px;
      width: auto;
      border-radius: 6px;
      display: inline-block;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8em;
      transform: translateY(-4px);
    }
    
    .mad-lib-input:focus {
      background: #FFFFFF;
      border-color: #f97316;
      border-style: solid;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }

    /* Selection simulation */
    .highlightable {
      position: relative;
      cursor: text;
      transition: all 0.2s;
      border-radius: 4px;
      padding: 2px 4px;
      background-color: transparent;
      margin: 0 2px;
    }
    .highlightable:hover {
      background-color: rgba(0, 0, 0, 0.03);
    }
    .highlightable.selected {
      background-color: #DBEAFE; /* blue-100 */
      color: #1E3A8A; /* blue-900 */
    }

    /* Notion/Medium style toolbar */
    .floating-toolbar {
      background: #1A1A1A;
      border-radius: 8px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255,255,255,0.1);
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 2px;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      white-space: nowrap;
    }
    
    .floating-toolbar::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px 5px 0;
      border-style: solid;
      border-color: #232326 transparent transparent transparent;
    }

    .toolbar-btn {
      color: #E5E7EB;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    
    .toolbar-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #FFF;
    }

    .toolbar-divider {
      width: 1px;
      height: 16px;
      background: rgba(255,255,255,0.15);
      margin: 0 4px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #D1D5DB;
      border-radius: 3px;
    }
    
    .locked-overlay {
      position: relative;
    }
    .locked-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(4px);
      border-radius: inherit;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { motion, AnimatePresence } = window.Motion;

    const HighlightableText = ({ id, text, onAddInsight, isLocked }) => {
      const [showMenu, setShowMenu] = useState(false);
      
      return (
        <span 
          className={`highlightable ${showMenu ? 'selected' : ''}`}
          onMouseEnter={() => setShowMenu(true)}
          onMouseLeave={() => setShowMenu(false)}
        >
          {text}
          {showMenu && isLocked && (
            <motion.div 
              initial={{ opacity: 0, y: 5, scale: 0.95 }}
              animate={{ opacity: 1, y: 0, scale: 1 }}
              className="floating-toolbar"
            >
              <button 
                onClick={(e) => { e.stopPropagation(); onAddInsight(text, 'insight'); setShowMenu(false); }}
                className="toolbar-btn"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-yellow-400"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Highlight Insight
              </button>
              <div className="toolbar-divider"></div>
              <button 
                onClick={(e) => { e.stopPropagation(); onAddInsight(text, 'feature'); setShowMenu(false); }}
                className="toolbar-btn"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-purple-400"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Extract Feature
              </button>
            </motion.div>
          )}
        </span>
      );
    };

    const App = () => {
      const [isLocked, setIsLocked] = useState(true);
      const [values, setValues] = useState({
        category: 'CRM',
        audience: 'Freelance Designers',
        problem: 'inconsistent client feedback loops'
      });
      
      const [insights, setInsights] = useState([
        { id: 1, text: "Designers need visual versioning", type: "feature" },
        { id: 2, text: "Asynchronous feedback is a nightmare without accounts", type: "insight" }
      ]);

      const addInsight = (text, type) => {
        setInsights([...insights, { id: Date.now(), text, type }]);
      };

      const removeInsight = (id) => {
        setInsights(insights.filter(i => i.id !== id));
      };

      useEffect(() => {
        lucide.createIcons();
      }, []);

      return (
        <div className="flex flex-col h-screen overflow-hidden">
          {/* Header */}
          <header className="h-14 border-b border-gray-200/80 bg-white/80 backdrop-blur-md flex items-center justify-between px-6 shrink-0 z-20 sticky top-0">
            <div className="flex items-center space-x-2">
              <div className="w-6 h-6 bg-gradient-to-tr from-brand-900 to-brand-700 rounded flex items-center justify-center shadow-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
              </div>
              <span className="font-bold text-gray-900 tracking-tight">NicheAI</span>
              <span className="text-gray-300 mx-2">/</span>
              <span className="text-gray-600 text-sm font-medium flex items-center gap-2">
                PLG Builder
                <span className="bg-gray-100 text-gray-500 text-[10px] px-1.5 py-0.5 rounded font-bold uppercase tracking-wider">Draft</span>
              </span>
            </div>
            
            <div className="flex items-center space-x-4">
              <div className="flex items-center gap-3 bg-gray-100 p-1 rounded-lg">
                <button 
                  onClick={() => setIsLocked(true)}
                  className={`px-3 py-1 text-xs font-medium rounded-md transition-colors ${isLocked ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:text-gray-700'}`}
                >
                  Pre-Gate (Locked)
                </button>
                <button 
                  onClick={() => setIsLocked(false)}
                  className={`px-3 py-1 text-xs font-medium rounded-md transition-colors ${!isLocked ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:text-gray-700'}`}
                >
                  Post-Gate (Unlocked)
                </button>
              </div>
            </div>
          </header>

          {/* Main Layout */}
          <div className="flex flex-1 overflow-hidden">
            
            {/* Strategy Canvas (Left) */}
            <main className="flex-1 overflow-y-auto p-8 lg:p-12 relative">
              <div className="max-w-3xl mx-auto space-y-12">
                
                {/* Core Thesis */}
                <section>
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-xs font-semibold text-gray-500 uppercase tracking-widest">Core Thesis</h2>
                    {!isLocked && <span className="text-xs font-medium text-green-600 bg-green-50 px-2 py-1 rounded-md border border-green-200">Unlocked Mode</span>}
                  </div>
                  
                  {isLocked ? (
                    <div className="panel p-10 shadow-sm border border-gray-200/60 bg-white">
                      <div className="text-3xl md:text-4xl leading-relaxed text-gray-900 font-serif font-medium">
                        <span className="italic text-gray-400 font-normal">I want to build a</span>
                        <input type="text" className="mad-lib-input mx-2" value={values.category} onChange={(e) => setValues({...values, category: e.target.value})} style={{ width: `${Math.max(values.category.length, 3) + 1}ch` }} /> 
                        <span className="italic text-gray-400 font-normal">for</span>
                        <input type="text" className="mad-lib-input mx-2" value={values.audience} onChange={(e) => setValues({...values, audience: e.target.value})} style={{ width: `${Math.max(values.audience.length, 10) + 1}ch` }} /> 
                        <br className="hidden md:block"/>
                        <span className="italic text-gray-400 font-normal">that solves</span>
                        <input type="text" className="mad-lib-input mx-2 mt-2 md:mt-0" value={values.problem} onChange={(e) => setValues({...values, problem: e.target.value})} style={{ width: `${Math.max(values.problem.length, 15) + 1}ch` }} />.
                      </div>
                    </div>
                  ) : (
                    <div className="panel p-10 shadow-sm border border-gray-200/60 bg-white group cursor-text transition-colors hover:border-gray-300 focus-within:border-brand-500 focus-within:ring-1 focus-within:ring-brand-500">
                      <textarea 
                        className="w-full text-3xl md:text-4xl leading-relaxed text-gray-900 font-serif font-medium resize-none outline-none bg-transparent"
                        rows="3"
                        defaultValue={`I want to build a ${values.category} for ${values.audience} that solves ${values.problem}.`}
                      />
                    </div>
                  )}
                </section>

                {/* Market Intelligence / Features */}
                <section>
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-xs font-semibold text-gray-500 uppercase tracking-widest">Market Intelligence</h2>
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-5 gap-6">
                    {/* Source Text that can be highlighted */}
                    <div className="md:col-span-3 panel p-0 shadow-sm overflow-hidden flex flex-col">
                      <div className="bg-gray-50 border-b border-gray-200 px-5 py-3 flex justify-between items-center">
                        <h3 className="text-sm font-semibold text-gray-700 flex items-center gap-2">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                          User Verbatims
                        </h3>
                        {isLocked && <span className="text-xs text-gray-500 font-medium bg-white border border-gray-200 px-2 py-0.5 rounded shadow-sm">Highlight to save</span>}
                      </div>
                      
                      <div className="p-6 text-sm text-gray-700 leading-relaxed space-y-5 bg-white font-sans">
                        <div className="relative pl-4 border-l-2 border-brand-200 hover:border-brand-400 transition-colors">
                          <div className="absolute -left-[9px] top-0 bg-brand-100 text-brand-600 w-4 h-4 rounded-full flex items-center justify-center text-[8px] font-bold ring-2 ring-white">1</div>
                          <p>
                            <HighlightableText 
                              text="HubSpot is way too complex" 
                              onAddInsight={addInsight} 
                              isLocked={isLocked}
                            /> for my freelance design business. I spend more time setting up pipelines than actually designing.
                          </p>
                        </div>
                        <div className="relative pl-4 border-l-2 border-brand-200 hover:border-brand-400 transition-colors">
                          <div className="absolute -left-[9px] top-0 bg-brand-100 text-brand-600 w-4 h-4 rounded-full flex items-center justify-center text-[8px] font-bold ring-2 ring-white">2</div>
                          <p>
                            I tried Dubsado but <HighlightableText 
                              text="the client portal looks terrible and isn't customizable" 
                              onAddInsight={addInsight} 
                              isLocked={isLocked}
                            /> enough for a design agency.
                          </p>
                        </div>
                        <div className="relative pl-4 border-l-2 border-brand-200 hover:border-brand-400 transition-colors">
                          <div className="absolute -left-[9px] top-0 bg-brand-100 text-brand-600 w-4 h-4 rounded-full flex items-center justify-center text-[8px] font-bold ring-2 ring-white">3</div>
                          <p>
                            <HighlightableText 
                              text="Getting feedback asynchronously on Figma files is a nightmare" 
                              onAddInsight={addInsight} 
                              isLocked={isLocked}
                            /> when clients don't want to create accounts to leave comments.
                          </p>
                        </div>
                      </div>
                    </div>

                    <div className="md:col-span-2 flex flex-col gap-6">
                      <div className={`panel p-0 shadow-sm overflow-hidden flex flex-col h-full ${isLocked ? 'locked-overlay' : ''}`}>
                        {isLocked && (
                          <div className="absolute inset-0 z-20 flex items-center justify-center flex-col gap-3">
                            <div className="bg-white p-3 rounded-full shadow-card text-gray-900 border border-gray-100">
                              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            </div>
                            <span className="text-sm font-semibold text-gray-900 bg-white/80 px-3 py-1 rounded backdrop-blur shadow-sm">Deep Edit Strategy</span>
                          </div>
                        )}
                        <div className="bg-gray-50 border-b border-gray-200 px-5 py-3 flex justify-between items-center">
                          <h3 className="text-sm font-semibold text-gray-700 flex items-center gap-2">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="text-brand-500"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            Custom Features
                          </h3>
                        </div>
                        <div className="p-5 bg-white flex-1">
                          {!isLocked ? (
                            <textarea className="w-full h-full resize-none text-sm text-gray-700 outline-none" placeholder="Draft custom features here..." defaultValue="- Drag and drop kanban board&#10;- Client-facing white-label portal&#10;- Automatic PDF invoice generation" />
                          ) : (
                            <div className="space-y-4">
                              <div className="h-4 bg-gray-200 rounded w-3/4"></div>
                              <div className="h-4 bg-gray-200 rounded w-1/2"></div>
                              <div className="h-4 bg-gray-200 rounded w-5/6"></div>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
              </div>
            </main>

            {/* Intelligence Sidebar (Right) */}
            <aside className="w-[340px] border-l border-gray-200 bg-white flex flex-col shrink-0 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-10">
              <div className="p-5 border-b border-gray-100 flex items-center justify-between">
                <div>
                  <h2 className="font-bold text-gray-900 flex items-center gap-2 text-base tracking-tight">
                    Intelligence Vault
                  </h2>
                  <p className="text-[11px] text-gray-500 mt-1 uppercase tracking-wider font-semibold">Curation Board</p>
                </div>
                <div className="flex items-center justify-center w-6 h-6 rounded-full bg-brand-50 text-brand-600 font-bold text-xs">
                  {insights.length}
                </div>
              </div>
              
              <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50/50">
                <AnimatePresence>
                  {insights.length === 0 ? (
                    <div className="text-center py-12 px-4">
                      <div className="w-12 h-12 bg-white rounded-xl shadow-sm border border-gray-200 flex items-center justify-center mx-auto mb-4">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                      </div>
                      <p className="text-sm font-medium text-gray-900 mb-1">No insights yet</p>
                      <p className="text-xs text-gray-500 leading-relaxed">Highlight text in the Strategy Canvas to curate insights.</p>
                    </div>
                  ) : (
                    insights.map((insight, idx) => (
                      <motion.div 
                        key={insight.id}
                        initial={{ opacity: 0, y: 10, scale: 0.95 }}
                        animate={{ opacity: 1, y: 0, scale: 1 }}
                        exit={{ opacity: 0, scale: 0.95, transition: { duration: 0.15 } }}
                        className="bg-white rounded-xl p-4 shadow-subtle border border-gray-200 group relative hover:border-gray-300 transition-all cursor-default flex flex-col gap-3"
                      >
                        <button 
                          onClick={() => removeInsight(insight.id)}
                          className="absolute top-3 right-3 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
                        >
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                        
                        <div className="flex items-center justify-between">
                          <span className={`inline-flex items-center gap-1.5 px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider ${insight.type === 'feature' ? 'bg-purple-50 text-purple-600 border border-purple-100' : 'bg-yellow-50 text-yellow-600 border border-yellow-100'}`}>
                            {insight.type === 'feature' ? (
                              <><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                              Feature Gap</>
                            ) : (
                              <><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                              Market Insight</>
                            )}
                          </span>
                        </div>
                        
                        <div className="pl-3 border-l-2 border-gray-100">
                          <p className="text-[13px] text-gray-700 leading-relaxed">"{insight.text}"</p>
                        </div>
                      </motion.div>
                    ))
                  )}
                </AnimatePresence>
              </div>

              <div className="p-5 border-t border-gray-100 bg-white">
                {isLocked ? (
                  <button className="w-full bg-gray-900 text-white text-sm font-medium py-3 rounded-lg shadow-float hover:bg-gray-800 transition-all flex items-center justify-center gap-2 group">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400 group-hover:text-white transition-colors"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Unlock to Generate Spec
                  </button>
                ) : (
                  <button className="w-full bg-brand-600 text-white text-sm font-medium py-3 rounded-lg shadow-float hover:bg-brand-700 transition-all flex items-center justify-center gap-2 group">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Generate Technical Spec
                  </button>
                )}
                <p className="text-center mt-3 text-[11px] text-gray-500 font-medium">
                  {isLocked ? "Requires free account to continue" : "Human-in-the-loop review"}
                </p>
              </div>
            </aside>
            
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
