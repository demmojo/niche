pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{js,ts,jsx,tsx,json,css,md}"
      run: npx prettier --write {staged_files} && git add {staged_files}
    tests:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx vitest related --run {staged_files}

pre-push:
  commands:
    type-check:
      run: npx tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
